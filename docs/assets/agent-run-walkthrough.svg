<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Install and run the JFrog Platform Dashboard Skill</title>
  <desc id="desc">A fictional terminal session showing APM installation, agent invocation, JFrog instance selection and report confirmation.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{fill:#f0f6fc;font-size:25px;font-weight:750}.label{fill:#40d348;font-size:11px;font-weight:800;letter-spacing:1.4px}.body{fill:#c9d1d9;font-size:15px}.muted{fill:#8b949e;font-size:13px}.prompt{fill:#7ee787}.answer{fill:#f0f6fc;font-size:15px;font-weight:700}.panel{fill:#090c10;stroke:#30363d;stroke-width:1.5}.bar{fill:#111820}.divider{stroke:#30363d}.step{fill:#40d348}.bubble{fill:#111820;stroke:#30363d}.user{fill:#0e2917;stroke:#238636}
    </style>
  </defs>
  <rect width="1200" height="900" rx="22" fill="url(#page)"/>
  <text x="60" y="58" class="label">CUSTOMER WALKTHROUGH</text>
  <text x="60" y="94" class="title">Install once. Ask your agent. Confirm the dashboard.</text>
  <text x="60" y="121" class="muted">Fictional example for Claude Code. The same workflow applies to other supported agents.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="160" width="520" height="680" rx="14" class="panel"/>
    <path d="M60 210h520" class="divider"/>
    <circle cx="86" cy="185" r="5" fill="#ff7b72"/><circle cx="104" cy="185" r="5" fill="#d29922"/><circle cx="122" cy="185" r="5" fill="#40d348"/>
    <text x="320" y="191" text-anchor="middle" class="muted">Terminal</text>
    <circle cx="96" cy="248" r="18" class="step"/><text x="96" y="254" text-anchor="middle" fill="#07120a" font-size="14" font-weight="800">1</text>
    <text x="128" y="252" class="title" font-size="18">Create the APM project</text>
    <text x="88" y="296" class="mono prompt" font-size="14">$ mkdir -p ~/jfrog-platform-reporting</text>
    <text x="88" y="326" class="mono prompt" font-size="14">$ cd ~/jfrog-platform-reporting</text>
    <text x="88" y="356" class="mono prompt" font-size="14">$ apm init -y</text>
    <path d="M88 388h464" class="divider"/>
    <circle cx="96" cy="426" r="18" class="step"/><text x="96" y="432" text-anchor="middle" fill="#07120a" font-size="14" font-weight="800">2</text>
    <text x="128" y="430" class="title" font-size="18">Install for your agent</text>
    <text x="88" y="474" class="mono prompt" font-size="14">$ apm install liquid-jedi/</text>
    <text x="108" y="500" class="mono prompt" font-size="14">jfrog-platform-report-skills \</text>
    <text x="108" y="526" class="mono prompt" font-size="14">--target claude</text>
    <text x="88" y="560" class="mono muted">✓ Installed 1 Skill for Claude Code</text>
    <path d="M88 590h464" class="divider"/>
    <circle cx="96" cy="628" r="18" class="step"/><text x="96" y="634" text-anchor="middle" fill="#07120a" font-size="14" font-weight="800">3</text>
    <text x="128" y="632" class="title" font-size="18">Start the agent</text>
    <text x="88" y="670" class="mono prompt" font-size="14">$ claude</text>
    <text x="88" y="716" class="muted">For Codex, use codex. For Gemini CLI, use gemini.</text>
    <text x="88" y="740" class="muted">For Antigravity CLI, use agy.</text>
    <path d="M88 772h464" class="divider"/>
    <text x="88" y="808" class="label">THEN CONTINUE IN AGENT CHAT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="160" width="520" height="680" rx="14" class="panel"/>
    <path d="M620 210h520" class="divider"/>
    <circle cx="646" cy="185" r="5" fill="#ff7b72"/><circle cx="664" cy="185" r="5" fill="#d29922"/><circle cx="682" cy="185" r="5" fill="#40d348"/>
    <text x="880" y="191" text-anchor="middle" class="muted">Agent chat</text>

    <rect x="786" y="234" width="320" height="56" rx="12" class="user"/>
    <text x="806" y="258" class="answer">You</text>
    <text x="806" y="279" class="body">Generate weekly JFrog Platform dashboard</text>

    <rect x="650" y="310" width="456" height="128" rx="12" class="bubble"/>
    <text x="670" y="336" class="answer">Agent</text>
    <text x="670" y="360" class="body">Choose a JFrog instance:</text>
    <text x="690" y="386" class="body">1  production  <tspan class="muted">(default)</tspan></text>
    <text x="690" y="412" class="body">2  staging</text>
    <text x="690" y="428" class="muted">Reply with a number.</text>

    <rect x="1030" y="452" width="76" height="42" rx="12" class="user"/>
    <text x="1068" y="479" text-anchor="middle" class="answer">1</text>

    <rect x="650" y="502" width="456" height="118" rx="12" class="bubble"/>
    <text x="670" y="528" class="answer">Agent</text>
    <text x="670" y="552" class="body">Use these recommended first-run choices?</text>
    <text x="690" y="576" class="muted">Last completed week  ·  Full dashboard</text>
    <text x="690" y="598" class="muted">Asia/Kolkata  ·  ~/jfrog-platform-reports</text>

    <rect x="814" y="636" width="292" height="46" rx="12" class="user"/>
    <text x="960" y="665" text-anchor="middle" class="answer">Yes, use the recommended choices</text>

    <rect x="650" y="700" width="456" height="72" rx="12" class="bubble"/>
    <text x="670" y="726" class="answer">Agent</text>
    <text x="670" y="750" class="body">Backfill 2 available weeks for Trends?</text>

    <rect x="1016" y="786" width="90" height="42" rx="12" class="user"/>
    <text x="1061" y="813" text-anchor="middle" class="answer">Yes</text>
  </g>
</svg>
