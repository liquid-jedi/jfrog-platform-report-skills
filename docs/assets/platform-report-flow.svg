<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">JFrog Platform Report Skill workflow</title>
  <desc id="desc">JFrog Platform evidence moves through an Agent Skill used by Claude Code, Codex, Gemini and Antigravity, then becomes a modular executive report.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%"><stop offset="0" stop-color="#151c26"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.muted{fill:#8b949e}.white{fill:#f0f6fc}.green{fill:#40d348}.blue{fill:#58a6ff}.cyan{fill:#39c5cf}.violet{fill:#a98df5}.red{fill:#ff7b72}.box{fill:#090c10;stroke:#30363d}.panel{fill:#111820;stroke:#30363d}.flow{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:7 7;animation:dash 6s linear infinite}.product{fill:#6e7681;animation:pulse 4s ease-in-out infinite}.p2{animation-delay:.7s}.p3{animation-delay:1.4s}.p4{animation-delay:2.1s}.p5{animation-delay:2.8s}.particle{filter:url(#glow);animation:travel 2.4s linear infinite}.delay1{animation-delay:.8s}.delay2{animation-delay:1.6s}.out{animation-name:travelOut;fill:#58a6ff}.out2{animation-delay:1.2s}.skill-card{animation:breathe 3.2s ease-in-out infinite;transform-origin:440px 238px}.agent{animation:agentPulse 4s ease-in-out infinite}.a2{animation-delay:.8s}.a3{animation-delay:1.6s}.a4{animation-delay:2.4s}.skeleton{animation:reveal 6s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-100}}@keyframes pulse{0%,100%{fill:#6e7681}10%,25%{fill:#40d348}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@keyframes agentPulse{0%,100%{opacity:.58}18%,35%{opacity:1}}@keyframes reveal{0%,38%{opacity:1}48%,92%{opacity:0}100%{opacity:1}}@keyframes travel{0%{transform:translate(190px,238px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(350px,238px);opacity:0}}@keyframes travelOut{0%{transform:translate(530px,238px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(642px,238px);opacity:0}}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="498" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <text x="450" y="51" text-anchor="middle" class="white" font-size="24" font-weight="700">JFrog Platform Report Skill</text>
  <text x="450" y="78" text-anchor="middle" class="muted" font-size="12">Validated JFrog evidence becomes a consistent leadership report</text>
  <path d="M190 238H350M530 238H650" class="flow"/>
  <circle r="5" class="green particle"/><circle r="5" class="green particle delay1"/><circle r="5" class="green particle delay2"/>
  <circle r="5" class="particle out"/><circle r="5" class="particle out out2"/>
  <rect x="40" y="118" width="150" height="240" rx="9" class="panel"/>
  <text x="115" y="153" text-anchor="middle" class="white" font-size="18" font-weight="700">JFrog Platform</text>
  <text x="115" y="196" text-anchor="middle" class="product" font-size="13">Artifactory</text>
  <text x="115" y="227" text-anchor="middle" class="product p2" font-size="13">Xray</text>
  <text x="115" y="258" text-anchor="middle" class="product p3" font-size="13">Curation</text>
  <text x="115" y="289" text-anchor="middle" class="product p4" font-size="13">JAS and Runtime</text>
  <text x="115" y="320" text-anchor="middle" class="product p5" font-size="13">AI Security</text>
  <g class="skill-card">
    <rect x="350" y="146" width="180" height="184" rx="12" fill="#090c10" stroke="#40d348" stroke-width="2"/>
    <path d="M410 176h45l22 22v62h-67z" fill="#111820" stroke="#40d348" stroke-width="2"/>
    <path d="M455 176v22h22" fill="none" stroke="#40d348" stroke-width="2"/>
    <path d="M423 216h41M423 229h41M423 242h27" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
    <path d="M444 270l7 7 14-17" fill="none" stroke="#40d348" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="306" text-anchor="middle" class="white" font-size="16" font-weight="700">Agent Skill</text>
  </g>
  <g transform="translate(362 353)">
    <g class="agent"><circle cx="20" cy="18" r="16" fill="#151b23" stroke="#a98df5"/><path d="M20 8l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#a98df5"/><text x="20" y="48" text-anchor="middle" class="muted" font-size="9">Claude</text></g>
    <g class="agent a2" transform="translate(43)"><circle cx="20" cy="18" r="16" fill="#151b23" stroke="#58a6ff"/><path d="M20 8a10 10 0 1 1-7 3" fill="none" stroke="#58a6ff" stroke-width="3"/><path d="M11 8v8h8" fill="none" stroke="#58a6ff" stroke-width="2"/><text x="20" y="48" text-anchor="middle" class="muted" font-size="9">Codex</text></g>
    <g class="agent a3" transform="translate(86)"><circle cx="20" cy="18" r="16" fill="#151b23" stroke="#39c5cf"/><path d="M20 7c2 7 5 9 12 11-7 2-10 4-12 11-2-7-5-9-12-11 7-2 10-4 12-11z" fill="#39c5cf"/><text x="20" y="48" text-anchor="middle" class="muted" font-size="9">Gemini</text></g>
    <g class="agent a4" transform="translate(129)"><circle cx="20" cy="18" r="16" fill="#151b23" stroke="#40d348"/><path d="M10 23c8-14 12-14 20 0M14 24h12" fill="none" stroke="#40d348" stroke-width="2.5" stroke-linecap="round"/><text x="20" y="48" text-anchor="middle" class="muted" font-size="9">Antigravity</text></g>
  </g>
  <rect x="650" y="92" width="220" height="332" rx="9" class="box"/>
  <text x="670" y="119" class="muted" font-size="9" letter-spacing="1">WEEKLY REPORT</text>
  <text x="670" y="139" class="white" font-size="14" font-weight="700">Platform Value &amp; Risk</text>
  <path d="M665 152h190" stroke="#30363d"/>
  <g class="panel"><rect x="670" y="168" width="82" height="64" rx="5"/><rect x="768" y="168" width="82" height="64" rx="5"/><rect x="670" y="242" width="82" height="64" rx="5"/><rect x="768" y="242" width="82" height="64" rx="5"/></g>
  <g font-size="9" class="muted"><text x="680" y="185">PERIOD XRAY</text><text x="778" y="185">CRITICAL</text><text x="680" y="259">CURATION</text><text x="778" y="259">REPOSITORIES</text></g>
  <g font-size="18" font-weight="700"><text x="680" y="213" class="red">2,840</text><text x="778" y="213" class="red">126</text><text x="680" y="287" class="green">68,420</text><text x="778" y="287" class="green">246</text></g>
  <g class="skeleton" fill="#30363d"><rect x="677" y="198" width="65" height="20" rx="3"/><rect x="775" y="198" width="65" height="20" rx="3"/><rect x="677" y="272" width="65" height="20" rx="3"/><rect x="775" y="272" width="65" height="20" rx="3"/></g>
  <rect x="670" y="319" width="180" height="38" rx="5" class="panel"/><text x="680" y="334" class="muted" font-size="8">TOP RISK</text><text x="680" y="348" class="red" font-size="10">Critical intake needs owners</text>
  <rect x="670" y="370" width="180" height="38" rx="5" class="panel"/><text x="680" y="385" class="muted" font-size="8">NEXT ACTION</text><text x="680" y="399" class="green" font-size="10">Prioritize fixable findings</text>
</svg>
