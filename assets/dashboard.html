</style></head><body><header class="report-header"><div class="mast"><div class="mast-top"><div class="brand-lockup"><!--JFROG_LOGO--></div><div class="mast-title"><div class="eyebrow">Software supply chain intelligence</div><h1>JFrog Platform Value &amp; Risk Report</h1></div><div class="export-tools"><div class="export-card"><strong>Export</strong><button class="export-button" type="button" data-export-mode="executive">Executive</button><button class="export-button active" type="button" data-export-mode="full">Full</button><button class="export-button" type="button" data-export-mode="custom">Custom</button><button class="export-button primary" type="button" id="print-report">Print / Save PDF</button><div class="custom-sections" id="custom-sections"></div></div></div></div></div></header><main class="wrap"><!--JFROG_PLATFORM_REPORT_STATIC--></main><footer><!--REPORT_FOOTER--></footer><script type="application/json" id="report-data">__JFROG_PLATFORM_REPORT_DATA__</script><script>
(function(){
  const sections=[...document.querySelectorAll('main .section[id]')];
  const custom=document.getElementById('custom-sections');
  const tabs=[...document.querySelectorAll('.section-nav a[href^="#"]')];
  function activateTab(id){tabs.forEach(tab=>tab.classList.toggle('active',tab.getAttribute('href')==='#'+id));}
  tabs.forEach(tab=>tab.addEventListener('click',()=>activateTab(tab.getAttribute('href').slice(1))));
  if('IntersectionObserver' in window){
    const observer=new IntersectionObserver(entries=>{const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible)activateTab(visible.target.id)},{rootMargin:'-15% 0px -70% 0px',threshold:[0,.1,.5]});
    sections.forEach(section=>observer.observe(section));
  }
  sections.forEach(section=>{const label=document.createElement('label');const title=(section.querySelector('h2')||{}).textContent||section.id;label.innerHTML='<input type="checkbox" value="'+section.id+'" checked> '+title;custom.appendChild(label)});
  function apply(mode){
    const selected=new Set(mode==='executive'?['executive','trend','recommendations','evidence']:mode==='full'?sections.map(x=>x.id):[...custom.querySelectorAll('input:checked')].map(x=>x.value));
    sections.forEach(section=>section.classList.toggle('export-hidden',!selected.has(section.id)));
    document.querySelectorAll('.section-nav a[href^="#"]').forEach(link=>link.classList.toggle('export-hidden',!selected.has(link.getAttribute('href').slice(1))));
    custom.classList.toggle('open',mode==='custom');
    document.querySelectorAll('[data-export-mode]').forEach(button=>button.classList.toggle('active',button.dataset.exportMode===mode));
    document.body.dataset.exportMode=mode;
  }
  document.querySelectorAll('[data-export-mode]').forEach(button=>button.addEventListener('click',()=>apply(button.dataset.exportMode)));
  custom.addEventListener('change',()=>apply('custom'));
  document.getElementById('print-report').addEventListener('click',()=>window.print());
  const requested=new URLSearchParams(location.search).get('export');
  apply(['executive','full'].includes(requested)?requested:'full');
})();
</script></body></html>
